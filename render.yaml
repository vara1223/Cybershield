services:
  - type: web
    name: cybershield-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./cybershield.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        value: cybershield-secure-admin-token-2026
      - key: SUPABASE_URL
        value: https://ufrdaobwktyuodqfnont.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
