name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ufrdaobwktyuodqfnont.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_53QafwVpywkn0a2nD6A5dQ_yD08GOAH
      EXPO_PUBLIC_ADMIN_API_KEY: cybershield-secure-admin-token-2026
      SUPABASE_URL: https://ufrdaobwktyuodqfnont.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_53QafwVpywkn0a2nD6A5dQ_yD08GOAH
      ADMIN_API_KEY: cybershield-secure-admin-token-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Export Web Build
        working-directory: ./frontend
        run: |
          npx expo export --platform web
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
