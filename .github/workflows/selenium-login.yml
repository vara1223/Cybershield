name: Selenium E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ufrdaobwktyuodqfnont.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_53QafwVpywkn0a2nD6A5dQ_yD08GOAH
      EXPO_PUBLIC_ADMIN_API_KEY: cybershield-secure-admin-token-2026
      SUPABASE_URL: https://ufrdaobwktyuodqfnont.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_53QafwVpywkn0a2nD6A5dQ_yD08GOAH
      ADMIN_API_KEY: cybershield-secure-admin-token-2026

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium openpyxl requests

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Start Expo Web Dev Server
      working-directory: ./frontend
      run: |
        npx expo start --web --non-interactive &
        EXPO_PID=$!
        echo "Expo PID: $EXPO_PID"
        echo "Waiting for Expo server readiness..."
        for i in $(seq 1 12); do
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081 2>/dev/null || echo "0")
          echo "Attempt $i: status=$STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Expo dev server is ready!"
            break
          fi
        done

    - name: Run Selenium Test Suite
      run: |
        python backend/automated_test/run_mock_selenium_tests.py

    - name: Run Security Assessment & Load Test Check
      run: |
        python backend/automated_test/generate_final_report.py

